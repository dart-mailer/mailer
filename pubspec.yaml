name: mailer
version: 7.2.2
description: >
  Compose and send emails from Dart.
  Supports file attachments and HTML emails.
homepage: https://github.com/dart-mailer/mailer#readme
repository: https://github.com/dart-mailer/mailer
issue_tracker: https://github.com/dart-mailer/mailer/issues
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  async: '^2.11.0'
  crypto: '^3.0.3'
  logging: '^1.2.0'
  intl: '>=0.19.0 <0.21.0'
  mime: '>=1.0.5 <3.0.0'
  path: '^1.8.3'
  meta: '^1.11.0'
  punycoder: '^0.3.0'
  unorm_dart: '^0.3.2'

dev_dependencies:
  args: '^2.7.0'
  test: '^1.29.0'
  googleapis_auth: '>=1.4.1 <3.0.0'
  http: '^1.6.0'
  lints: '>=3.0.0 <7.0.0'
