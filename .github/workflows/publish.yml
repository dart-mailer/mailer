name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Triggers on tags like v1.2.3 or v1.2.3+1
  workflow_dispatch: # Allows you to manually trigger a retry from the Actions tab

jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC authentication
      contents: write # Required to create the GitHub release

    runs-on: ubuntu-latest

    environment: pub.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Publish to pub.dev
        # The '--force' is safe here because the tag and
        # environment approval act as your confirmation.
        run: dart pub publish --force

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # Use the matching CHANGELOG.md section as release notes.
        run: |
          awk -v v="## ${TAG#v}" '$0 == v {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
